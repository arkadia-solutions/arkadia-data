name: Release
# git push origin v0.3.1 → binaries for macOS (universal, signed and
# notarized), Linux (x86_64, arm64) and Windows, a GitHub Release with the
# archives, checksums and the CHANGELOG section of that version, then — after
# the release — the Homebrew formula in arkadia-solutions/homebrew-tap, the
# crate on crates.io, @arkadia/data on npm and arkadia-data on PyPI.
# Each publishing step runs only when its secret is set (see .env.example) and
# skips a version that is already published (registries cannot overwrite).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: The tag matches ./VERSION and every package uses it
        run: |
          IFS= read -r version < VERSION || true
          version=${version//[[:space:]]/}  # also drops \r (Windows checkouts)
          if [[ $GITHUB_REF_TYPE == tag && $GITHUB_REF_NAME != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match VERSION $version"; exit 1
          fi
          bash scripts/version.sh check
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, name: macos-universal, target: '' }
          - { os: ubuntu-latest, name: linux-x86_64, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, name: linux-arm64, target: aarch64-unknown-linux-musl }
          - { os: windows-latest, name: windows-x86_64, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target || 'aarch64-apple-darwin,x86_64-apple-darwin' }}
      - name: Build, sign and notarize
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_INSTALLER_IDENTITY: ${{ secrets.APPLE_INSTALLER_IDENTITY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -n "${{ matrix.target }}" ]]; then
            bash scripts/release.sh --target "${{ matrix.target }}"
          elif [[ -n $APPLE_CERTIFICATE_P12 ]]; then
            bash scripts/release.sh
          else
            echo "::warning::no Apple certificate in the secrets: the macOS binary is not signed"
            bash scripts/release.sh --no-sign
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ak-data-${{ matrix.name }}
          path: dist/release/*
          if-no-files-found: error

  release:
    needs: [check, build]
    # A manual run (workflow_dispatch) only builds; publishing needs a tag.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist/release
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          v=${{ needs.check.outputs.version }}
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md > notes.md
          [[ -s notes.md ]] || echo "AK-DATA $v" > notes.md
          (cd dist/release && cat *.sha256 > SHA256SUMS)
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${{ needs.check.outputs.version }}
          # GitHub may answer 504 to one long request: create the release
          # first, then upload each file on its own, retrying.
          retry() {
            local n
            for n in 1 2 3 4 5; do
              "$@" && return 0
              echo "::warning::attempt $n failed: $*"
              sleep $((n * 15))
            done
            return 1
          }
          ls -la dist/release
          # A timed-out create may still have created the release: check first.
          create() {
            gh release view "v$v" > /dev/null 2>&1 ||
              gh release create "v$v" --title "AK-DATA $v" --notes-file notes.md --verify-tag
          }
          retry create
          for f in dist/release/*; do
            retry gh release upload "v$v" "$f" --clobber
          done
          gh release view "v$v"
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: dist/release/*.sha256

  homebrew:
    needs: [check, release]
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: dist/release
      - name: Formula/ak-data.rb in arkadia-solutions/homebrew-tap
        if: env.TAP_TOKEN != ''
        run: |
          v=${{ needs.check.outputs.version }}
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/arkadia-solutions/homebrew-tap.git" tap
          mkdir -p tap/Formula
          bash scripts/homebrew-formula.sh dist/release > tap/Formula/ak-data.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/ak-data.rb
          git diff --cached --quiet || git commit -m "ak-data $v"
          git push
      - if: env.TAP_TOKEN == ''
        run: echo "::notice::HOMEBREW_TAP_TOKEN is not set — the Homebrew formula was not updated"

  crates:
    needs: [check, release]
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo publish
        if: env.CARGO_REGISTRY_TOKEN != ''
        working-directory: rust
        run: |
          v=${{ needs.check.outputs.version }}
          if curl -sfA "arkadia-release" "https://crates.io/api/v1/crates/arkadia-data/$v" > /dev/null; then
            echo "arkadia-data $v is already on crates.io"
          else
            cargo publish --locked
          fi
      - if: env.CARGO_REGISTRY_TOKEN == ''
        run: echo "::notice::CARGO_REGISTRY_TOKEN is not set — the crate was not published"

  npm:
    needs: [check, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # npm provenance: the package links to this build
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: npm publish @arkadia/data
        if: env.NODE_AUTH_TOKEN != ''
        working-directory: typescript
        run: |
          v=${{ needs.check.outputs.version }}
          if npm view "@arkadia/data@$v" version > /dev/null 2>&1; then
            echo "@arkadia/data $v is already on npm"
            exit 0
          fi
          [[ $(node -p "require('./package.json').version") == "$v" ]] || { echo "::error::package.json is not $v"; exit 1; }
          npm ci
          npm test
          npm publish --access public --provenance   # prepublishOnly builds dist/
      - if: env.NODE_AUTH_TOKEN == ''
        run: echo "::notice::NPM_TOKEN is not set — @arkadia/data was not published"

  pypi:
    needs: [check, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # PyPI trusted publishing (when configured on pypi.org)
    env:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
      PYPI_TRUSTED: ${{ vars.PYPI_TRUSTED_PUBLISHING }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: uv publish arkadia-data
        if: env.PYPI_API_TOKEN != '' || env.PYPI_TRUSTED == 'true'
        working-directory: python
        run: |
          v=${{ needs.check.outputs.version }}
          if curl -sfA "arkadia-release" "https://pypi.org/pypi/arkadia-data/$v/json" > /dev/null; then
            echo "arkadia-data $v is already on PyPI"
            exit 0
          fi
          uv run --all-extras pytest -q
          rm -rf dist && uv build
          ls dist
          for f in dist/*; do [[ $f == *"$v"* ]] || { echo "::error::$f is not $v"; exit 1; }; done
          if [[ -n $PYPI_API_TOKEN ]]; then
            uv publish --token "$PYPI_API_TOKEN"
          else
            uv publish --trusted-publishing always
          fi
      - if: env.PYPI_API_TOKEN == '' && env.PYPI_TRUSTED != 'true'
        run: echo "::notice::PYPI_API_TOKEN is not set (nor PYPI_TRUSTED_PUBLISHING=true) — arkadia-data was not published to PyPI"
