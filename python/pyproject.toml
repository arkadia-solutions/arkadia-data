[tool.ruff]
# Same as Black.
line-length = 88
indent-width = 4

# Assume Python 3.10. Change this to match your project version.
target-version = "py310"

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
# I (Isort) - Import sorting
select = ["E4", "E7", "E9", "F", "I"]

# Ignore specific rules (e.g., line length in comments)
ignore = []

# Allow fix for all enabled rules (when `--fix` is provided).
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[project]
name = "arkadia-data"
version = "0.3.0"
description = "AK-Data (Arkadia Data Format): a lossless, schema-first JSON alternative that cuts LLM tokens for prompts, tool results and agent memory. The ak-data command line tool is the Rust crate (cargo install arkadia-data)."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Arkadia Solutions", email = "contact@arkadia.solutions" }
]
requires-python = ">=3.10"
keywords = ["ak-data", "arkadia", "llm", "ai", "agents", "tokens", "json", "toon", "serialization", "prompt", "mcp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The core library has no dependencies.
dependencies = []

[project.optional-dependencies]
# Exact token counts and the formats compared by `make benchmark` (python -m arkadia.bench).
bench = ["tiktoken>=0.7", "toon-format>=1.0", "pyyaml>=6"]
# The AI benchmark uses only the standard library; python-dotenv lets it read .env files.
ai = ["python-dotenv>=1.0"]
all = ["tiktoken>=0.7", "toon-format>=1.0", "pyyaml>=6", "python-dotenv>=1.0"]

[project.urls]
Homepage = "https://arkadia.solutions/akdata"
Repository = "https://github.com/arkadia-solutions/arkadia-data"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arkadia"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.15.1",
    "tiktoken>=0.7",
    "toon-format>=1.0",
    "pyyaml>=6",
]
